<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Sprint — Playable Prototype</title>
<style>
  :root { font-family: system-ui, Arial, sans-serif; color: #172033; background: #f3f6fb; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .app { width: min(760px, 100%); background: white; border: 1px solid #dce3ef; border-radius: 18px; padding: 22px; box-shadow: 0 12px 35px #17203312; }
  h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2.2rem); }
  .sub { margin: 0 0 18px; color: #58657a; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { background: #eef3fb; border-radius: 10px; padding: 10px 14px; min-width: 100px; }
  .stat strong { display: block; font-size: 1.25rem; }
  .arena { position: relative; height: 340px; overflow: hidden; border-radius: 14px; border: 2px solid #cbd7e8; background: linear-gradient(#f8fbff, #e8f1ff); }
  .star { position: absolute; border: 0; border-radius: 50%; width: 48px; height: 48px; background: #ffd166; box-shadow: 0 3px 0 #e3a93d; font-size: 25px; cursor: pointer; display: grid; place-items: center; user-select: none; }
  .star:focus-visible { outline: 3px solid #315bd6; }
  .message { min-height: 28px; margin: 13px 0 8px; font-weight: 650; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  button.action { border: 0; border-radius: 10px; padding: 11px 16px; background: #2457d6; color: white; font-weight: 700; cursor: pointer; }
  button.secondary { background: #e8edf6; color: #172033; }
  .help { color: #58657a; font-size: .92rem; margin-top: 14px; }
</style>
</head>
<body>
<main class="app">
  <h1>Star Sprint</h1>
  <p class="sub">A tiny original arcade game: click stars before time runs out.</p>
  <section class="stats" aria-label="Game status">
    <div class="stat">Score<strong id="score">0</strong></div>
    <div class="stat">Time<strong id="time">60</strong></div>
    <div class="stat">Target<strong>10 points</strong></div>
  </section>
  <div class="arena" id="arena" aria-label="Game area"></div>
  <p class="message" id="message" aria-live="polite">Press Start, then click the stars as quickly as you can.</p>
  <div class="controls">
    <button class="action" id="start">Start game</button>
    <button class="action secondary" id="reset">Reset</button>
  </div>
  <p class="help"><b>Controls:</b> Mouse or touchscreen. Each star is worth 1 point. Reach 10 points in 60 seconds to win.</p>
</main>
<script>
(() => {
  const arena = document.getElementById('arena');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const message = document.getElementById('message');
  const startBtn = document.getElementById('start');
  const resetBtn = document.getElementById('reset');
  let score = 0, time = 60, running = false, clock = null, spawn = null;

  function clearTimers() {
    if (clock) clearInterval(clock);
    if (spawn) clearInterval(spawn);
    clock = null; spawn = null;
  }
  function clearStars() { arena.replaceChildren(); }
  function finish(won) {
    running = false;
    clearTimers();
    clearStars();
    message.textContent = won ? `You win! Final score: ${score}. Great job!` : `Time's up! Final score: ${score}. Try again to reach 15.`;
    startBtn.textContent = 'Play again';
  }
  function makeStar() {
    if (!running) return;
    const star = document.createElement('button');
    star.className = 'star';
    star.type = 'button';
    star.textContent = '★';
    star.setAttribute('aria-label', 'Collect star for one point');
    const maxX = Math.max(0, arena.clientWidth - 48);
    const maxY = Math.max(0, arena.clientHeight - 48);
    star.style.left = Math.floor(Math.random() * (maxX + 1)) + 'px';
    star.style.top = Math.floor(Math.random() * (maxY + 1)) + 'px';
    star.addEventListener('click', () => {
      if (!running || !star.isConnected) return;
      score++;
      scoreEl.textContent = score;
      star.remove();
      message.textContent = `Nice! Score: ${score}.`;
      if (score >= 10) finish(true);
    });
    arena.appendChild(star);
    setTimeout(() => { if (star.isConnected) star.remove(); }, 1500);
  }
  function startGame() {
    clearTimers(); clearStars();
    score = 0; time = 60; running = true;
    scoreEl.textContent = score; timeEl.textContent = time;
    message.textContent = 'Go! Collect 10 stars before the timer reaches zero.';
    startBtn.textContent = 'Restart game';
    makeStar();
    spawn = setInterval(makeStar, 700);
    clock = setInterval(() => {
      time--;
      timeEl.textContent = time;
      if (time <= 0) finish(score >= 10);
    }, 1000);
  }
  function resetGame() {
    running = false; clearTimers(); clearStars();
    score = 0; time = 60;
    scoreEl.textContent = score; timeEl.textContent = time;
    message.textContent = 'Press Start, then click the stars as quickly as you can.';
    startBtn.textContent = 'Start game';
  }
  startBtn.addEventListener('click', startGame);
  resetBtn.addEventListener('click', resetGame);
})();
</script>
</body>
</html>
